[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nitrosight"
version = "1.0.0"
description = "Explainable nitrosamine potency categorization from chemical structure images"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "nitrosamine",
    "NDSRI",
    "CPCA",
    "impurity",
    "cheminformatics",
    "regulatory",
]

authors = [
    { name = "Aryan Shah" },
    { name = "Kushaan Sharma" },
    { name = "Mariame Ali Hassan", email = "mariame_ali@tamu.edu" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "rdkit>=2023.9.1",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5.0"]
tools = ["openpyxl>=3.1.0"]

[project.urls]
Homepage = "https://github.com/aryanpshah/nitrosight"
Issues = "https://github.com/aryanpshah/nitrosight/issues"

[project.scripts]
nitrosight = "score:main"
nitrosight-gui = "gui.main:main"

[tool.setuptools]
packages = ["cpca", "resolve", "gui"]
py-modules = ["score", "pipeline", "osr", "run_gui"]

[tool.setuptools.package-data]
# resolve/fda_limits.py reads this at import time, so an installed copy needs it
# inside the package; data/ at the repository root is not installed.
resolve = ["data/*.json"]
